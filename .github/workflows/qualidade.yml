name: Qualidade em MOCK
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inter_pj_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:55439:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/inter_pj_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar backend
        working-directory: backend
        run: |
          rustup update stable
          cargo +stable fmt --check
          cargo +stable clippy --locked --all-targets --all-features -- -D warnings
          cargo +stable test --locked --features testes-postgres
          cargo +stable install cargo-audit --locked
          cargo +stable audit
      - name: Verificar frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm test
          npm run build
          npm audit
          npx playwright install --with-deps chromium
      - name: Validar Compose e navegação
        run: |
          umask 077
          mkdir -p secrets/e2e
          openssl rand -out secrets/e2e/db_root -hex 32
          openssl rand -out secrets/e2e/db_app -hex 32
          openssl rand -out secrets/e2e/admin -hex 32
          openssl rand -out secrets/e2e/mfa_key -hex 32
          chmod 700 secrets/e2e && chmod 444 secrets/e2e/*
          APP_BIND_ADDRESS=127.0.0.1 APP_PORT=18080 APP_ORIGIN=http://127.0.0.1:18080 \
            docker compose -p inter-pj-manager-e2e -f compose.yml -f compose.e2e.yml up -d --build
          curl --retry 30 --retry-all-errors --retry-delay 2 -fsS http://127.0.0.1:18080/ready
          export E2E_ORIGIN=http://127.0.0.1:18080
          export E2E_EMAIL=admin@e2e.local
          export E2E_PASSWORD="$(cat secrets/e2e/admin)"
          cd frontend && npm run e2e
