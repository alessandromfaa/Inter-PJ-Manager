services:
  web:
    ports: !reset []
  tls:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./infrastructure/local-tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/tls:/etc/nginx/tls:ro
    depends_on:
      web: {condition: service_healthy}
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [front]
