worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 limit_req_zone $binary_remote_addr zone=auth:1m rate=12r/m;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 8k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  location = /api/login { limit_req zone=auth burst=5 nodelay; limit_req_status 429; proxy_pass http://api:8080; }
  location = /api/sincronizar { proxy_read_timeout 260s; proxy_pass http://api:8080; }
  location /api/ { proxy_pass http://api:8080; }
  location = /metrics { proxy_pass http://api:8080; }
  location = /ready { proxy_pass http://api:8080; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
