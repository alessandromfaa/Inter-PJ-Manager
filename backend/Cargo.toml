[package]
name = "inter-pj-manager"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
argon2 = "0.5"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter","json"] }
uuid = { version = "1", features = ["v4","serde"] }
anyhow = "1"

rand_core = { version = "0.6", features = ["getrandom"] }
sqlx-core = { version = "=0.9.1", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "migrate"] }
sqlx-postgres = { version = "=0.9.1", features = ["uuid","migrate"] }

[features]
testes-postgres = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
